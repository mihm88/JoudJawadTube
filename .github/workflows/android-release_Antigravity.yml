name: Android CI/CD & Automated In-App Release

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APK and Publish GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for Gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Configure Production Signing Keystore
        if: ${{ env.JJT_KEYSTORE_BASE64 != '' }}
        env:
          JJT_KEYSTORE_BASE64: ${{ secrets.JJT_KEYSTORE_BASE64 }}
        run: |
          echo "$JJT_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "Decoded production release keystore into runner temp"

      - name: Build Android Release APK
        env:
          JJT_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          JJT_KEYSTORE_PASSWORD: ${{ secrets.JJT_KEYSTORE_PASSWORD }}
          JJT_KEY_ALIAS: ${{ secrets.JJT_KEY_ALIAS }}
          JJT_KEY_PASSWORD: ${{ secrets.JJT_KEY_PASSWORD }}
        run: |
          if [ -f "$RUNNER_TEMP/release.jks" ]; then
            echo "Building signed Release APK with production keystore..."
            ./gradlew assembleRelease --stacktrace
          else
            echo "Keystore secret not set; falling back to assembleDebug..."
            ./gradlew assembleDebug --stacktrace
          fi

      - name: Determine Version Tag
        id: determine_tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v1.1.${{ github.run_number }}"
          fi
          echo "RELEASE_TAG=$TAG" >> $GITHUB_ENV
          echo "Determined release tag: $TAG"

      - name: Prepare APK Asset for Release
        run: |
          mkdir -p release-artifacts
          SOURCE_APK=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          DEST_APK="release-artifacts/JoudJawadTube-${{ env.RELEASE_TAG }}.apk"
          if [ -n "$SOURCE_APK" ] && [ -f "$SOURCE_APK" ]; then
            cp "$SOURCE_APK" "$DEST_APK"
            echo "Copied $SOURCE_APK to $DEST_APK"
          else
            echo "Error: No APK found in app/build/outputs/apk!"
            find app/build/outputs/apk -name "*.apk"
            exit 1
          fi

      - name: Cleanup Keystore
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "Joud&Jawad Tube ${{ env.RELEASE_TAG }}"
          body: |
            ### Joud&Jawad Tube Automated Build & Release (${{ env.RELEASE_TAG }})

            Automated build triggered by commit: `${{ github.sha }}` on branch `${{ github.ref_name }}`.

            #### What's Included:
            - **In-App Scoped Search**: Text field bug fixed with focus-safe `BasicTextField` and strictly scoped in-app searches across saved channels, playlists, and videos (zero external leaks).
            - **Organized Sidebar**: New dedicated sections for Channels, Playlists, and Categories.
            - **Player Controls**: Resolution selector (Auto up to 4K 2160p) and Repeat playback mode (Off, Single Video, All / Playlist loop).
            - **Scroll Position Preservation**: Seamless return to exact home catalog scroll position after playback.
            - **Top-Bar Category Navigation**: Browsing chips for instant filtering.
            - **Automatic Device Detection**: Seamless Leanback TV vs Tablet mode without manual top-bar switches.
            - **In-App Updater**: Automated GitHub Releases checker and APK installer.

            #### Download:
            Download the attached `JoudJawadTube-${{ env.RELEASE_TAG }}.apk` below or update directly within the app under **Settings > App Updates & GitHub Sync**.
          draft: false
          prerelease: false
          files: release-artifacts/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
