<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <!-- Background video frame gradient simulation -->
    <linearGradient id="vidBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07111c"/>
      <stop offset="50%" stop-color="#0c2338"/>
      <stop offset="100%" stop-color="#03080e"/>
    </linearGradient>

    <!-- Top & Bottom HUD Vignette gradients -->
    <linearGradient id="topVignette" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.92"/>
      <stop offset="60%" stop-color="#000000" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="bottomVignette" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.96"/>
      <stop offset="50%" stop-color="#000000" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="focusGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF2222"/>
      <stop offset="100%" stop-color="#CC0000"/>
    </linearGradient>

    <filter id="hudShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.8"/>
    </filter>

    <filter id="btnGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#FF0000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Video Simulated Background Canvas -->
  <rect width="1280" height="720" fill="url(#vidBg)"/>

  <!-- Simulated Cinematic Content Graphics (Stars & Aurora & Landscape) -->
  <g opacity="0.45">
    <circle cx="200" cy="180" r="1.5" fill="#FFF"/>
    <circle cx="340" cy="90" r="1" fill="#FFF"/>
    <circle cx="480" cy="160" r="2" fill="#FFF"/>
    <circle cx="650" cy="80" r="1.2" fill="#FFF"/>
    <circle cx="820" cy="130" r="1.8" fill="#FFF"/>
    <circle cx="990" cy="110" r="1" fill="#FFF"/>
    <circle cx="1120" cy="170" r="2" fill="#FFF"/>
    <path d="M 0 520 Q 350 420 700 500 T 1280 460 L 1280 720 L 0 720 Z" fill="#040b12"/>
    <path d="M 0 570 Q 420 480 850 560 T 1280 530 L 1280 720 L 0 720 Z" fill="#020508"/>
    <circle cx="950" cy="220" r="45" fill="#FFEAA7" opacity="0.15"/>
    <circle cx="950" cy="220" r="30" fill="#FFF" opacity="0.25"/>
  </g>

  <!-- Top Vignette Overlay -->
  <rect x="0" y="0" width="1280" height="180" fill="url(#topVignette)"/>

  <!-- Bottom Vignette Overlay -->
  <rect x="0" y="440" width="1280" height="280" fill="url(#bottomVignette)"/>

  <!-- ================= TOP HUD BAR ================= -->
  <!-- Back Button (TV Focus outline ready) -->
  <g transform="translate(48, 40)">
    <circle cx="22" cy="22" r="22" fill="#1E1E1E" fill-opacity="0.8" stroke="#444" stroke-width="1.5"/>
    <path d="M 26 14 L 18 22 L 26 30" stroke="#FFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Video Metadata Header -->
  <g transform="translate(108, 40)">
    <text x="0" y="18" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="20" letter-spacing="-0.2">
      Stories of the Prophets for Children: Prophet Yunus &amp; The Whale
    </text>
    <text x="0" y="38" fill="#AAAAAA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">
      Islamic Kids Stories • Playing from Playlist: <tspan fill="#4FC3F7">Quran Stories 4K</tspan> • Video 3 of 12
    </text>
  </g>

  <!-- Top Right Badges (4K UHD, 60fps, Codec, Clock) -->
  <g transform="translate(1010, 42)">
    <!-- 4K UHD Badge -->
    <rect x="0" y="0" width="68" height="26" rx="5" fill="#E50914" filter="url(#hudShadow)"/>
    <text x="34" y="17" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="11" text-anchor="middle">4K UHD</text>
    
    <!-- 60 FPS Badge -->
    <rect x="76" y="0" width="56" height="26" rx="5" fill="#222222" stroke="#444" stroke-width="1"/>
    <text x="104" y="17" fill="#EEEEEE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11" text-anchor="middle">60 FPS</text>

    <!-- Codec Badge -->
    <rect x="140" y="0" width="76" height="26" rx="5" fill="#222222" stroke="#444" stroke-width="1"/>
    <text x="178" y="17" fill="#00E676" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11" text-anchor="middle">HEVC HW</text>
  </g>

  <!-- ================= PLAYBACK PROGRESS BAR ================= -->
  <!-- Elapsed & Total Time -->
  <text x="56" y="582" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="14">14:38</text>
  <text x="1224" y="582" fill="#AAAAAA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="14" text-anchor="end">28:50</text>

  <!-- Seekbar Track Container -->
  <g transform="translate(56, 592)">
    <!-- Background Track -->
    <rect x="0" y="0" width="1168" height="6" rx="3" fill="#3A3A3A"/>
    <!-- Buffered Track -->
    <rect x="0" y="0" width="760" height="6" rx="3" fill="#666666"/>
    <!-- Played Track -->
    <rect x="0" y="0" width="580" height="6" rx="3" fill="#FF0000"/>
    <!-- Scrubber Head -->
    <circle cx="580" cy="3" r="8" fill="#FFFFFF" filter="url(#hudShadow)"/>
    <circle cx="580" cy="3" r="4" fill="#FF0000"/>
  </g>

  <!-- ================= BOTTOM ACTION HUD ================= -->
  <g transform="translate(56, 624)">
    <!-- 1. Play / Pause Button -->
    <g transform="translate(0, 0)">
      <rect width="48" height="48" rx="24" fill="#262626" stroke="#444" stroke-width="1.5"/>
      <!-- Pause Two Bars -->
      <rect x="17" y="15" width="4" height="18" rx="1.5" fill="#FFF"/>
      <rect x="27" y="15" width="4" height="18" rx="1.5" fill="#FFF"/>
    </g>

    <!-- 2. Skip Previous -->
    <g transform="translate(64, 0)">
      <rect width="48" height="48" rx="24" fill="#262626" stroke="#444" stroke-width="1.5"/>
      <path d="M 21 17 L 21 31 M 29 17 L 22 24 L 29 31 Z" fill="#FFF" stroke="#FFF" stroke-width="1.5" stroke-linejoin="round"/>
    </g>

    <!-- 3. Skip Next -->
    <g transform="translate(128, 0)">
      <rect width="48" height="48" rx="24" fill="#262626" stroke="#444" stroke-width="1.5"/>
      <path d="M 27 17 L 27 31 M 19 17 L 26 24 L 19 31 Z" fill="#FFF" stroke="#FFF" stroke-width="1.5" stroke-linejoin="round"/>
    </g>

    <!-- 4. REPEAT CONTROL PILL (Repeat: All mode active) -->
    <g transform="translate(196, 0)">
      <rect width="146" height="48" rx="24" fill="#1C2E24" stroke="#00C853" stroke-width="2"/>
      <!-- Repeat Icon with All Badge -->
      <g transform="translate(16, 14)">
        <path d="M 3 8 L 15 8 C 17.5 8 19 9.5 19 12 L 19 13 M 6 5 L 2 8 L 6 11" fill="none" stroke="#00E676" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M 19 13 L 7 13 C 4.5 13 3 11.5 3 9 M 16 16 L 20 13 L 16 10" fill="none" stroke="#00E676" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <text x="48" y="29" fill="#00E676" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="13">Repeat: All</text>
    </g>

    <!-- 5. RESOLUTION SELECTOR PILL (Focused state - TV D-Pad focus!) -->
    <g transform="translate(358, 0)" filter="url(#btnGlow)">
      <!-- Red Focused Border Pill -->
      <rect width="168" height="48" rx="24" fill="#E50914" stroke="#FFFFFF" stroke-width="2.5"/>
      <!-- Settings/Tuner Icon -->
      <g transform="translate(18, 14)">
        <circle cx="10" cy="10" r="4" fill="none" stroke="#FFF" stroke-width="2"/>
        <path d="M 10 2 L 10 5 M 10 15 L 10 18 M 2 10 L 5 10 M 15 10 L 18 10" stroke="#FFF" stroke-width="2" stroke-linecap="round"/>
      </g>
      <text x="46" y="29" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="13">Quality: 4K UHD</text>
    </g>

    <!-- 6. Audio Tracks Selector Pill -->
    <g transform="translate(542, 0)">
      <rect width="144" height="48" rx="24" fill="#262626" stroke="#444" stroke-width="1.5"/>
      <!-- Speaker Icon -->
      <g transform="translate(16, 14)">
        <path d="M 3 6 L 7 6 L 12 2 L 12 18 L 7 14 L 3 14 Z" fill="#DDD"/>
        <path d="M 15 7 C 16.5 8.5 16.5 11.5 15 13" fill="none" stroke="#DDD" stroke-width="2" stroke-linecap="round"/>
      </g>
      <text x="42" y="29" fill="#EEEEEE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="13">Audio: Stereo</text>
    </g>

    <!-- 7. Subtitles Track Pill -->
    <g transform="translate(702, 0)">
      <rect width="144" height="48" rx="24" fill="#262626" stroke="#444" stroke-width="1.5"/>
      <!-- CC Icon -->
      <g transform="translate(16, 14)">
        <rect x="1" y="3" width="18" height="14" rx="3" fill="none" stroke="#DDD" stroke-width="2"/>
        <text x="5" y="14" fill="#DDD" font-family="sans-serif" font-weight="800" font-size="9">CC</text>
      </g>
      <text x="44" y="29" fill="#EEEEEE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="13">Subs: Arabic</text>
    </g>

    <!-- 8. Aspect Ratio Mode Pill -->
    <g transform="translate(862, 0)">
      <rect width="134" height="48" rx="24" fill="#262626" stroke="#444" stroke-width="1.5"/>
      <!-- Ratio Icon -->
      <rect x="16" y="16" width="16" height="16" rx="2" fill="none" stroke="#DDD" stroke-width="2"/>
      <text x="42" y="29" fill="#EEEEEE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="13">Fit Screen</text>
    </g>
  </g>

  <!-- ================= FLOATING RESOLUTION POPUP DIALOG (OVERLAY) ================= -->
  <!-- Demonstrating the Active Quality Picker Dialog on TV -->
  <g transform="translate(358, 280)" filter="url(#hudShadow)">
    <rect width="210" height="290" rx="14" fill="#141414" stroke="#333333" stroke-width="1.5"/>
    <text x="20" y="28" fill="#AAAAAA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11" letter-spacing="1">SELECT QUALITY</text>

    <!-- Options List -->
    <!-- 1. Auto -->
    <g transform="translate(12, 42)">
      <rect width="186" height="34" rx="8" fill="#1F1F1F"/>
      <text x="14" y="22" fill="#DDDDDD" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="13">Auto (Adaptive)</text>
    </g>

    <!-- 2. 4K UHD (Current Selection / Focused) -->
    <g transform="translate(12, 82)">
      <rect width="186" height="34" rx="8" fill="#FF0000"/>
      <text x="14" y="22" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="13">4K Ultra HD (2160p)</text>
      <!-- Checkmark -->
      <polyline points="160,16 166,22 176,12" stroke="#FFF" stroke-width="2.5" fill="none"/>
    </g>

    <!-- 3. 2K QHD -->
    <g transform="translate(12, 122)">
      <rect width="186" height="34" rx="8" fill="transparent"/>
      <text x="14" y="22" fill="#CCCCCC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="13">2K Quad HD (1440p)</text>
    </g>

    <!-- 4. 1080p Full HD -->
    <g transform="translate(12, 162)">
      <rect width="186" height="34" rx="8" fill="transparent"/>
      <text x="14" y="22" fill="#CCCCCC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="13">1080p Full HD</text>
    </g>

    <!-- 5. 720p HD -->
    <g transform="translate(12, 202)">
      <rect width="186" height="34" rx="8" fill="transparent"/>
      <text x="14" y="22" fill="#CCCCCC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="13">720p HD</text>
    </g>

    <!-- 6. 480p / 360p -->
    <g transform="translate(12, 242)">
      <rect width="186" height="34" rx="8" fill="transparent"/>
      <text x="14" y="22" fill="#888888" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="12">480p / 360p SD</text>
    </g>
  </g>
</svg>
