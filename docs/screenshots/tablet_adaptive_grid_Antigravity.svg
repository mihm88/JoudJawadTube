    <text x="249" y="17" fill="#AAAAAA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="10" text-anchor="middle">TABLET AUTO-DETECT</text>
